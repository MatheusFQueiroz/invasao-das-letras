<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invasão das Letras</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Trebuchet MS",Verdana,sans-serif;background:#0E1233;color:#fff;display:flex;flex-direction:column;user-select:none}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#1A1F52;flex-shrink:0}
header h1{font-size:22px;letter-spacing:1px}
.chip{font-size:19px;font-weight:bold;border-radius:10px;padding:6px 14px;background:#2A3081}
#faseC{margin-left:auto}
#pontosC{background:#FFD900;color:#1A1F52}
#vidasC{background:#fff;color:#E03131}
#jogo{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%}
#teclado{flex-shrink:0;background:#1A1F52;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.linha{display:flex;gap:6px}
.tecla{width:50px;height:46px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:bold;text-transform:uppercase;border:3px solid transparent;position:relative}
.esq{background:#1C5FA8}.dir{background:#C9620E}
.tecla.casa::after{content:"";position:absolute;bottom:5px;width:14px;height:3px;border-radius:2px;background:#fff}
.tecla.prox{border-color:#FFD900;transform:scale(1.14);box-shadow:0 0 14px #FFD900}
.tecla.erro{background:#E03131}
#legenda{font-size:15px;display:flex;gap:18px}
#legenda span b{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
#tela{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;background:rgba(14,18,51,.94);text-align:center;padding:20px}
#tela .tit{font-size:50px;font-weight:bold;color:#FFD900}
#tela .sub{font-size:23px;line-height:1.45;max-width:760px}
#tela button{font:inherit;font-size:25px;font-weight:bold;padding:14px 34px;border:none;border-radius:14px;
  background:#2F9E44;color:#fff;cursor:pointer}
#tela .dica{font-size:17px;color:#AAB}
</style></head><body>
<header><h1>☄️ INVASÃO DAS LETRAS</h1>
 <div class="chip" id="faseC">—</div><div class="chip" id="vidasC">❤❤❤</div><div class="chip" id="pontosC">0 pontos</div></header>
<div id="jogo"><canvas id="cv"></canvas><div id="tela"></div></div>
<div id="teclado"></div>
<script>
(function(){
var FASES=[
 {nome:'Fase 1 — As teclas da casa',tipo:'letra',pool:'asdfjkl'.split(''),total:14,queda:16,intervalo:2.6},
 {nome:'Fase 2 — Todas as letras',tipo:'letra',pool:'abcdefghijklmnopqrstuvwxyz'.split(''),total:14,queda:15,intervalo:2.6},
 {nome:'Fase 3 — Palavras curtas',tipo:'palavra',pool:['sol','mar','pai','rio','lua','boi','mel','dia','ovo','uva','sal','tia','rei','ave'],total:10,queda:17,intervalo:3.8},
 {nome:'Fase 4 — Palavras médias',tipo:'palavra',pool:['bola','gato','pato','casa','mala','sapo','dedo','vaca','faca','lobo','rato','suco','pipa','sino','copo','luva'],total:10,queda:19,intervalo:4.6},
 {nome:'Fase 5 — Palavras grandes',tipo:'palavra',pool:['escola','janela','caneta','boneca','cavalo','girafa','tomate','banana','sapato','camelo'],total:8,queda:23,intervalo:5.8},
 {nome:'Fase 6 — O CHEFÃO',tipo:'palavra',pool:['sol','lua','mel','bola','gato','sapo','suco','escola','girafa','banana','cavalo','tomate'],total:12,queda:17,intervalo:3.4}
];
var ESQ='qwertasdfgzxcvb';
var cv=document.getElementById('cv'),cx=cv.getContext('2d'),tela=document.getElementById('tela');
var W=800,H=500,chao=460;
var G={fase:0,pontos:0,estrelas:[],vidas:3,met:[],alvo:null,lancados:0,destruidos:0,t:0,
 rodando:false,pausado:false,part:[],lasers:[],estrelasFundo:[]};

function tam(){var r=cv.parentNode.getBoundingClientRect();W=Math.max(400,r.width||800);H=Math.max(300,r.height||500);
 cv.width=W;cv.height=H;chao=H-40;
 G.estrelasFundo=[];for(var i=0;i<70;i++)G.estrelasFundo.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4});}

// ---------- teclado na tela ----------
var TK={};
(function(){var tec=document.getElementById('teclado');
 ['qwertyuiop','asdfghjkl','zxcvbnm'].forEach(function(l){var d=document.createElement('div');d.className='linha';
  l.split('').forEach(function(c){var k=document.createElement('div');
   k.className='tecla '+(ESQ.indexOf(c)>=0?'esq':'dir')+((c==='f'||c==='j')?' casa':'');k.textContent=c;TK[c]=k;d.appendChild(k);});
  tec.appendChild(d);});
 var lg=document.createElement('div');lg.id='legenda';
 lg.innerHTML='<span><b style="background:#1C5FA8"></b>mão ESQUERDA</span><span><b style="background:#C9620E"></b>mão DIREITA</span><span>F e J têm um risquinho: é a casa dos dedos</span>';
 tec.appendChild(lg);})();
function marcaProx(){for(var k in TK)TK[k].classList.remove('prox');
 var c=null;
 if(G.alvo)c=G.alvo.pal[G.alvo.dig];
 else{var baixo=null;G.met.forEach(function(m){if(!m.morto&&(!baixo||m.y>baixo.y))baixo=m;});if(baixo)c=baixo.pal[0];}
 if(c&&TK[c])TK[c].classList.add('prox');}
function piscaErro(c){if(!TK[c])return;TK[c].classList.add('erro');setTimeout(function(){TK[c].classList.remove('erro');},180);}

// ---------- telas ----------
function mostra(tit,sub,botao,acao,dica){
 tela.innerHTML='<div class="tit">'+tit+'</div><div class="sub">'+sub+'</div><button id="btT">'+botao+'</button>'+
  (dica?'<div class="dica">'+dica+'</div>':'');
 tela.style.display='flex';G.botao=acao;document.getElementById('btT').onclick=acao;}
function esconde(){tela.style.display='none';G.botao=null;}

function hud(){document.getElementById('faseC').textContent='Fase '+(G.fase+1)+' de '+FASES.length;
 document.getElementById('vidasC').textContent='❤'.repeat(Math.max(0,G.vidas))+'♡'.repeat(3-Math.max(0,G.vidas));
 document.getElementById('pontosC').textContent=G.pontos+' pontos';}

function inicioFase(){var F=FASES[G.fase];G.rodando=false;hud();
 mostra(F.nome,F.tipo==='letra'?'Digite a LETRA do meteoro antes que ele caia!':'Digite a PALAVRA inteira do meteoro antes que ele caia!',
  'COMEÇAR',comecaFase,'Aperte ENTER ou clique no botão · ESC pausa o jogo');}
function comecaFase(){G.met=[];G.alvo=null;G.lancados=0;G.destruidos=0;G.vidas=3;G.t=0;G.proxLanc=0.5;
 G.part=[];G.lasers=[];G.rodando=true;G.pausado=false;esconde();hud();}

function lanca(){var F=FASES[G.fase];
 var usadas={};G.met.forEach(function(m){if(!m.morto)usadas[m.pal[0]]=1;});
 var ops=F.pool.filter(function(p){return !usadas[p[0]];});if(!ops.length)ops=F.pool;
 var pal=ops[Math.floor(Math.random()*ops.length)];
 var raio=Math.max(30,14+pal.length*11);
 var x=raio+20+Math.random()*(W-2*raio-40);
 G.met.push({pal:pal,dig:0,x:x,y:-raio,r:raio,vel:(chao+raio)/F.queda,morto:false});G.lancados++;}

function fimFase(){G.rodando=false;G.alvo=null;
 if(G.vidas<=0){mostra('Os meteoros venceram!','Não tem problema: tente esta fase de novo.<br>Dica: procure a tecla ACESA no teclado aqui embaixo.',
  'TENTAR DE NOVO',comecaFase);return;}
 var est=G.vidas;G.estrelas[G.fase]=Math.max(G.estrelas[G.fase]||0,est);
 var ult=G.fase===FASES.length-1;
 mostra(est===3?'🌟 PERFEITO!':'✅ FASE CONCLUÍDA!','Você ganhou '+'⭐'.repeat(est)+'<br>'+G.pontos+' pontos até agora',
  ult?'VER RESULTADO':'PRÓXIMA FASE →',function(){if(ult)fimJogo();else{G.fase++;inicioFase();}});}

function fimJogo(){var tot=G.estrelas.reduce(function(a,b){return a+(b||0)},0);
 mostra('🏆 VOCÊ SALVOU O PLANETA!','Você fez <b>'+G.pontos+'</b> pontos e <b>'+tot+'</b> de '+(FASES.length*3)+' estrelas.<br><br>Anote o seu recorde no caderno!',
  'JOGAR DE NOVO',function(){G.fase=0;G.pontos=0;G.estrelas=[];inicioFase();});}

// ---------- digitar ----------
function tecla(c){
 if(!G.rodando||G.pausado)return;
 if(!G.alvo){
  var cand=null;G.met.forEach(function(m){if(!m.morto&&m.pal[0]===c&&(!cand||m.y>cand.y))cand=m;});
  if(!cand){piscaErro(c);G.combo=0;return;}
  G.alvo=cand;G.alvo.dig=1;tiro(cand);
 } else {
  if(G.alvo.pal[G.alvo.dig]===c){G.alvo.dig++;tiro(G.alvo);}
  else{piscaErro(c);G.combo=0;return;}
 }
 G.combo=(G.combo||0)+1;
 if(G.alvo.dig>=G.alvo.pal.length){explode(G.alvo);G.pontos+=G.alvo.pal.length*10+(G.combo>=10?20:0);
  G.alvo.morto=true;G.alvo=null;G.destruidos++;hud();}
}
function tiro(m){G.lasers.push({x:m.x,y:m.y,v:.15});}
function explode(m){for(var i=0;i<18;i++){var a=Math.random()*6.28,s=60+Math.random()*160;
 G.part.push({x:m.x,y:m.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,v:.7});}}

function passo(dt){
 if(!G.rodando||G.pausado)return;
 var F=FASES[G.fase];G.t+=dt;G.proxLanc-=dt;
 var vivos=G.met.filter(function(m){return !m.morto}).length;
 if(G.proxLanc<=0&&G.lancados<F.total&&vivos<5){lanca();G.proxLanc=F.intervalo;}
 G.met.forEach(function(m){if(m.morto)return;
  var lento=(G.alvo===m)?0.35:1;          // o meteoro mirado desacelera: da tempo de terminar a palavra
  m.y+=m.vel*dt*lento;
  if(m.y+m.r*0.3>=chao){m.morto=true;G.vidas--;if(G.alvo===m)G.alvo=null;G.combo=0;hud();}});
 G.met=G.met.filter(function(m){return !m.morto});
 G.part.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.v-=dt;});G.part=G.part.filter(function(p){return p.v>0});
 G.lasers.forEach(function(l){l.v-=dt;});G.lasers=G.lasers.filter(function(l){return l.v>0});
 if(G.vidas<=0){fimFase();return;}
 if(G.lancados>=F.total&&G.met.length===0)fimFase();
}

// ---------- desenho ----------
function desenha(){
 cx.fillStyle='#0E1233';cx.fillRect(0,0,W,H);
 cx.fillStyle='#fff';G.estrelasFundo.forEach(function(s){cx.globalAlpha=.5;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill();});
 cx.globalAlpha=1;
 cx.fillStyle='#2F9E44';cx.fillRect(0,chao,W,H-chao);
 cx.fillStyle='#1B6B31';for(var x=0;x<W;x+=40)cx.fillRect(x,chao,20,6);
 var bx=W/2,by=chao-4;
 cx.fillStyle='#C2C7E0';cx.beginPath();cx.moveTo(bx-22,by);cx.lineTo(bx,by-34);cx.lineTo(bx+22,by);cx.closePath();cx.fill();
 G.lasers.forEach(function(l){cx.strokeStyle='rgba(255,217,0,'+(l.v/.15)+')';cx.lineWidth=4;
  cx.beginPath();cx.moveTo(bx,by-34);cx.lineTo(l.x,l.y);cx.stroke();});
 G.met.forEach(function(m){
  var mir=(G.alvo===m);
  cx.fillStyle=mir?'#E8590C':'#8B5A2B';cx.beginPath();cx.arc(m.x,m.y,m.r,0,6.28);cx.fill();
  cx.fillStyle='rgba(0,0,0,.18)';cx.beginPath();cx.arc(m.x-m.r*.35,m.y-m.r*.3,m.r*.22,0,6.28);cx.fill();
  if(mir){cx.strokeStyle='#FFD900';cx.lineWidth=4;cx.beginPath();cx.arc(m.x,m.y,m.r+6,0,6.28);cx.stroke();}
  cx.font='bold '+(m.pal.length>1?26:32)+'px Trebuchet MS';cx.textAlign='left';cx.textBaseline='middle';
  var larg=cx.measureText(m.pal).width,x0=m.x-larg/2;
  var feito=m.pal.slice(0,m.dig),falta=m.pal.slice(m.dig);
  cx.fillStyle='#FFD900';cx.fillText(feito,x0,m.y);
  cx.fillStyle='#fff';cx.fillText(falta,x0+cx.measureText(feito).width,m.y);
 });
 G.part.forEach(function(p){cx.globalAlpha=Math.max(0,p.v/.7);cx.fillStyle='#FFB347';
  cx.beginPath();cx.arc(p.x,p.y,4,0,6.28);cx.fill();});cx.globalAlpha=1;
 if(G.pausado){cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(0,0,W,H);cx.fillStyle='#fff';cx.font='bold 44px Trebuchet MS';
  cx.textAlign='center';cx.fillText('PAUSADO — aperte ESC',W/2,H/2);}
}

var ult=0;
function loop(t){var dt=Math.min(.05,(t-ult)/1000||0);ult=t;passo(dt);desenha();marcaProx();requestAnimationFrame(loop);}

document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&G.rodando){G.pausado=!G.pausado;return;}
 if(e.key==='Enter'&&G.botao){e.preventDefault();G.botao();return;}
 if(e.key&&e.key.length===1){var c=e.key.toLowerCase();if(c>='a'&&c<='z'){e.preventDefault();tecla(c);}}
 if(e.key==='Backspace'||e.key===' ')e.preventDefault();
});
window.addEventListener('resize',tam);
window.__jogo={G:G,FASES:FASES,tecla:tecla,passo:passo,comecaFase:comecaFase,inicioFase:inicioFase,fimJogo:fimJogo,
 get tela(){return tela}};
tam();
mostra('☄️ INVASÃO DAS LETRAS','Meteoros com letras e palavras estão caindo!<br>Digite o que está escrito neles para destruí-los antes que cheguem ao chão.<br><br>Use as <b style="color:#5FA8FF">DUAS mãos</b>: as teclas azuis são da mão esquerda e as laranjas da direita.',
 'COMEÇAR',inicioFase,'Aperte ENTER ou clique no botão');
requestAnimationFrame(loop);
})();
</script></body></html>
