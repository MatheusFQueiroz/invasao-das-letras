# Publica o servidor de frases (Cloudflare Worker + KV) e grava o endereço em servidor.js.
# Precisa de dois segredos no repositório (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   (token com o modelo "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID  (aparece na página Workers & Pages do painel da Cloudflare)
# Guia completo: servidor/LEIAME.md
name: Servidor de frases (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "servidor/cloudflare/**"
      - ".github/workflows/servidor-cloudflare.yml"

permissions:
  contents: write

concurrency:
  group: servidor-cloudflare
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Confere os segredos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltam os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID. Veja servidor/LEIAME.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cria o banco KV (se ainda não existir) e publica o Worker
        working-directory: servidor/cloudflare
        run: |
          set -e
          npm install --no-audit --no-fund --silent wrangler@4
          W="npx wrangler"
          ID=$($W kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const l=JSON.parse(s);const n=l.find(x=>x.title==="invasao-frases-FRASES");console.log(n?n.id:"")}catch(e){console.log("")}})')
          if [ -z "$ID" ]; then
            SAIDA=$($W kv namespace create FRASES 2>&1); echo "$SAIDA"
            ID=$(echo "$SAIDA" | grep -o 'id = "[^"]*"' | head -1 | sed 's/id = "//;s/"$//')
          fi
          if [ -z "$ID" ]; then echo "::error::Não consegui criar nem achar o banco KV."; exit 1; fi
          echo "Banco KV: $ID"
          sed -i "s/SUBSTITUIDO_PELO_WORKFLOW/$ID/" wrangler.toml
          $W deploy 2>&1 | tee saida-deploy.txt
          URL=$(grep -o 'https://[A-Za-z0-9.-]*workers\.dev' saida-deploy.txt | head -1)
          if [ -z "$URL" ]; then echo "::error::O Worker foi publicado, mas não achei o endereço workers.dev na saída. Veja o painel da Cloudflare e cole o endereço em servidor.js."; exit 1; fi
          echo "URL_SERVIDOR=$URL" >> "$GITHUB_ENV"
          echo "### Servidor de frases no ar: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Testa o servidor publicado
        run: |
          set -e
          sleep 5
          R=$(curl -sS "$URL_SERVIDOR?acao=listar&sala=teste-do-workflow")
          echo "$R"
          echo "$R" | grep -q '"ok":true' || { echo "::error::O servidor respondeu, mas não como esperado."; exit 1; }

      - name: Grava o endereço do servidor em servidor.js
        run: |
          set -e
          if grep -q "\"$URL_SERVIDOR\"" servidor.js; then echo "servidor.js já aponta para $URL_SERVIDOR"; exit 0; fi
          sed -i "s#^var SERVIDOR_FRASES *= *\"[^\"]*\";#var SERVIDOR_FRASES = \"$URL_SERVIDOR\";#" servidor.js
          grep -q "\"$URL_SERVIDOR\"" servidor.js || { echo "::error::Não consegui editar servidor.js. Cole o endereço $URL_SERVIDOR à mão."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servidor.js
          git commit -m "Servidor de frases publicado em $URL_SERVIDOR"
          git push origin HEAD:main
          echo "servidor.js atualizado. O GitHub Pages republica o jogo em um ou dois minutos." >> "$GITHUB_STEP_SUMMARY"
